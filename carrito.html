<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - PixCell</title>
  <link rel="icon" href="assets/Copilot_20260907_190557.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/footer.css">
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img class="logo" src="assets/Copilot_20260907_190557.png" width="100px" alt=""></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mynavbar">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="nosotros.html" target="_blank" style="color: black;">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#productos" style="color: black;">Modelos</a></li>
          <li class="nav-item"><a class="nav-link" href="#footer-redes" style="color: black;">Contacto</a></li>
        </ul>
        <div class="d-flex align-items-center">
          <form class="d-flex">
            <input class="form-control me-2" type="text" placeholder="Search">
            <a href="error.html" class="btn btn-primary" type="button">Busqueda</a>
          </form>
          <a href="carrito.html" class="ms-3 text-dark fs-4">
            <i class="bi bi-cart3"></i>
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>

<!-- MAQUETADO DEL CARRITO -->
<main class="container my-5">
  <h2 class="mb-4"><i class="bi bi-cart3"></i> Tu Carrito (1 producto)</h2>
  
  <div class="row">
    <!-- Productos -->
    <div class="col-lg-8">
      <div class="card mb-3 shadow-sm">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
          <img src="assets/Copilot_20260907_190557.png" width="70" class="rounded">
          <div>
            <h6 class="mb-0">iPhone 15 Pro Max</h6>
            <small class="text-muted">PixCell - 256GB</small>
          </div>
          <span class="fw-bold">$1.299.999</span>
          <input type="number" value="1" min="1" class="form-control" style="width:70px">
          <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
        </div>
      </div>
      
      <div class="alert alert-info">¡Envío gratis superando los $500.000!</div>
    </div>

    <!-- Resumen -->
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Resumen de compra</h5>
          <div class="d-flex justify-content-between"><span>Subtotal</span><span>$1.299.999</span></div>
          <div class="d-flex justify-content-between"><span>Envío</span><span class="text-success">Gratis</span></div>
          <hr>
          <div class="d-flex justify-content-between fw-bold fs-5"><span>Total</span><span>$1.299.999</span></div>
          <a href="error.html" class="btn btn-primary w-100 mt-3">Finalizar Compra</a>
          <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">Seguir comprando</a>
        </div>
      </div>
    </div>
  </div>
  <div class="volver-inicio">
        <a href="index.html" class="btn btn-primary">volver a inicio</a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
