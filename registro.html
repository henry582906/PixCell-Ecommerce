<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - PixCeLL</title>
  <link rel="icon" href="assets/Copilot_20260907_190557.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="pixcell-billy">

  <div class="registro-billy">
    <h2 class="registro">REGISTRO</h2>

    <form id="form-registro" action="error.html" method="error.html" novalidate> <!--aqui se agrega para redirigir a la pagina error-->
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" autocomplete="name"
          minlength="3" required>
        <small class="error-msg"></small>
      </div>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="nombre@ejemplo.com" autocomplete="email" required>
        <small class="error-msg"></small>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres, 1 mayúscula y 1 número"
          autocomplete="new-password" minlength="8" required>
        <small class="hint">Mínimo 8 caracteres, incluye mayúscula, minúscula y número.</small>
        <small class="error-msg"></small>
      </div>
      <div class="campo">
        <label for="confirmar-password">Confirmar contraseña</label>
        <input type="password" id="confirmar-password" name="confirmar-password" placeholder="Repetí tu contraseña"
          autocomplete="new-password" minlength="8" required>
        <small class="error-msg"></small>
      </div>
      <div class="campo-checkbox">
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones.</label>
      </div>
      <button type="submit">Crear cuenta</button>
    </form>


  </div>
</body>

</html>
